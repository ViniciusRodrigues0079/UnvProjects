<!DOCTYPE html> <!-- Define o arquivo como uma página da web escrita em HTML -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css"> <!-- Faz a conexão entre esse arquivo HTML e o arquivo de estilização CSS -->
    <title>Aula 4</title>
</head>
<body> <!-- Explorando seções, bordas personalizadas, estilos de elementos, alinahmento, margem, gap etc.-->
    <section>
        <div class="box" style="border-style: solid; background:#ffff00;"> 01 </div> <!-- Inclui a div na classe box e adiciona um estilo de borda personalizado -->
        <div class="box" style="border-style: dotted;"> 02 </div>
        <div class="box" style="border-style: double; background-color: cyan;"> 03 </div>
    </section>
    <section>
        <div class="box" style="border-style: groove; background:#ff88b2;"> 04 </div> <!-- Adiciona uma cor de fundo personalizada a partir do comando "background" -->
        <div class="box" style="border-style: dashed; background-color: #ff00ff;"> 05 </div> <!-- Adiciona uma cor de fundo personalizada a partir do comando "background-color" -->
        <div class="box" style="border-style: ridge; background-color: #ff8800;"> 06 </div>
    </section>
    <section>
        <div class="box" style="border-style: outset; background-color: lightblue;"> 07 </div>
        <div class="box" style="border-style: inset; background-color: palegoldenrod;"> 08 </div>
        <div class="box" style="border-style: groove outset; background-color: red;"> 09 </div> <!-- Combina estilos de borda específicos, podendo fazer diversas combinações-->
    </section>
</body>
</html>
