<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>
</head>
<body>
    <marquee direction="right"> <!-- Adiciona um elemento que desliza na tela de um lado para o outro, com a direção definida como direita (elemento vai da esquerda para a direita) -->
    <h1>Olá, mundo!</h1>
    </marquee>
    <br>
    <marquee scrollamount="50"> <!-- Muda a velocidade do elemento deslizante para 50 -->
    <img src="../IMG/Bike.gif"> <!-- Importa o gif da pasta imagens -->
    </marquee>
</body>
</html>
